<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{KO_TITLE}}</title>
<style>
  :root { --fg:#1a1a1a; --muted:#666; --line:#e5e5e5; --accent:#c96442; --code-bg:#f6f6f4; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
      "Malgun Gothic", sans-serif;
    color: var(--fg); line-height: 1.75; max-width: 760px;
    margin: 0 auto; padding: 48px 24px 96px; background:#fff;
  }
  header { border-bottom: 2px solid var(--line); padding-bottom: 24px; margin-bottom: 32px; }
  h1 { font-size: 1.9rem; line-height: 1.35; margin: 0 0 12px; }
  .meta { color: var(--muted); font-size: 0.9rem; }
  .meta .orig { display:block; margin-top:6px; }
  .meta a { color: var(--accent); text-decoration: none; }
  h2 { font-size: 1.4rem; margin: 44px 0 8px; padding-top: 8px; }
  h3 { font-size: 1.15rem; margin: 30px 0 8px; color:#000; }
  .builders { color: var(--muted); font-size: 0.92rem; margin: 0 0 14px; }
  p { margin: 0 0 16px; }
  a { color: var(--accent); }
  ul { margin: 0 0 16px; padding-left: 22px; }
  li { margin-bottom: 8px; }
  blockquote { margin: 16px 0; padding: 8px 18px; border-left:3px solid var(--line);
    color:#333; font-style: italic; }
  hr { border: none; border-top: 1px solid var(--line); margin: 40px 0; }
  code { background: var(--code-bg); padding: 2px 6px; border-radius: 4px;
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 0.88em; }
  pre { background: var(--code-bg); padding: 16px 18px; border-radius: 8px;
    overflow-x: auto; border:1px solid var(--line); }
  pre code { background: none; padding: 0; font-size: 0.85rem; line-height:1.5; }
  figure { margin: 24px 0; }
  figure img { width: 100%; height: auto; border:1px solid var(--line); border-radius: 8px;
    background:#fff; }
  figure.hero img { border:none; max-width: 210px; display:block; margin: 0 auto 8px; }
  figcaption { color: var(--muted); font-size: 0.85rem; text-align: center;
    margin-top: 10px; line-height: 1.5; }
  figcaption a { color: var(--accent); }
  .video { position: relative; width: 100%; aspect-ratio: 16 / 9; margin: 22px 0; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; border-radius: 8px; }
  .callout { background:#faf6f4; border-left:3px solid var(--accent);
    padding: 12px 16px; border-radius: 0 6px 6px 0; margin: 16px 0; }
  .callout strong { color: var(--accent); }
  footer { margin-top: 64px; padding-top: 20px; border-top:1px solid var(--line);
    color: var(--muted); font-size: 0.82rem; }
</style>
<link rel="stylesheet" href="assets/nav.css">
</head>
<body>
<header>
  <h1>{{KO_TITLE}}</h1>
  <div class="meta">
    {{KO_DATE}} · 카테고리: {{CATEGORY}}
    <span class="orig">원문:
      <a href="{{ORIGINAL_URL}}">{{ORIGINAL_TITLE}}</a>
      (한글 번역본)</span>
  </div>
</header>

<!-- Optional hero (only if the post had one):
<figure class="hero"><img src="assets/<slug>/hero.svg" alt="..."></figure> -->

<!-- TRANSLATED BODY GOES HERE.
     - Faithful translation, no summarizing or omitting.
     - Place each content image as a <figure> under its section, with the caption translated.
     - Embed each YouTube video as:
         <div class="video"><iframe src="<embed-url>" title="<title>"
           allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
           allowfullscreen></iframe></div>
       Keep any ?start= parameter from the original embed URL.
     - Restore inline hyperlinks (body links AND links inside figure captions).
     - Use <blockquote> for pulled quotes, <div class="callout"> for tips/best-practices boxes. -->

<footer>
  이 글은 Claude 공식 블로그 원문을 한국어로 옮긴 비공식 번역본입니다.
  내용의 정확한 의미는 위 원문 링크를 함께 참고하세요.
</footer>
<script src="assets/store.js"></script>
<script src="assets/posts.js"></script>
<script src="assets/nav.js"></script>
</body>
</html>
